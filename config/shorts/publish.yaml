# Shared publishing settings for all Shorts
# Shared thumbnail canvas for Shorts (9:16). Long-form keeps 1920×1080 from base/channel.
thumbnail:
  target_width: 1080
  target_height: 1920
  aspect_ratio_tolerance: 0.48

youtube:
  shorts_title_template: "{main_title} #Shorts"
  shorts_description_template: |
    {main_title}

    #Shorts

    Credits:
    {credits}
  shorts_tags:
    - Shorts
    - viral
  shorts_extra_tags:
    - entertainment
