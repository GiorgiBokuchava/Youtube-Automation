name: Publish video

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 */2 * *" # every 2 days
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to run"
        required: true
        default: animals
        type: string

jobs:
  run:
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.channel || 'animals' }}

    concurrency:
      group: youtube-${{ github.event.inputs.channel || 'animals' }}
      cancel-in-progress: false

    env:
      CHANNEL: ${{ github.event.inputs.channel || 'animals' }}
      # Optional: repository variable YT_PRIVACY_STATUS (public | private | unlisted)
      # overrides youtube.privacy_status in YAML. If unset, leave empty so CI does
      # not override channel config (same as before YT_PRIVACY was added to this file).
      YT_PRIVACY: ${{ vars.YT_PRIVACY_STATUS }}

      # Reddit API (PRAW)
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

      # YouTube
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      # AI providers
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
      TEXT_GENERATOR_API_KEY: ${{ secrets.TEXT_GENERATOR_API_KEY }}

      # Cookies (base64 stored inside REDDIT_COOKIES secret)
      REDDIT_COOKIES: ${{ secrets.REDDIT_COOKIES }}
      REDDIT_COOKIES_FILE: reddit_cookies.txt

      # Instaloader session (base64 of sessions/instagram.session); optional if channel uses Reddit only
      INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Preflight — YouTube OAuth refresh token
        run: |
          python -c "from youtube_automation.youtube.auth import ensure_youtube_refresh_token; ensure_youtube_refresh_token()"

      - name: Write Reddit cookies (decode secret)
        run: |
          echo "$REDDIT_COOKIES" | base64 --decode > "$REDDIT_COOKIES_FILE"
          test -s "$REDDIT_COOKIES_FILE"

      - name: Preflight - test cookies with yt-dlp
        run: |
          yt-dlp --version
          yt-dlp --cookies "$REDDIT_COOKIES_FILE" --skip-download \
            "https://www.reddit.com/r/StartledCats/comments/17cn6g6/"

      - name: Decode Instagram session (if configured)
        run: |
          if [ -n "${INSTAGRAM_SESSION_B64:-}" ]; then
            python -c "from youtube_automation.instagram.client import decode_session; decode_session()"
          fi

      - name: Preflight — Instagram session (if configured)
        run: |
          if [ -n "${INSTAGRAM_SESSION_B64:-}" ]; then
            python <<'PY'
          import os
          from youtube_automation.config.loader import load_env, load_settings
          from youtube_automation.instagram.client import ensure_instagram_session_ok
          from youtube_automation.sourcing import instagram_sourcing_enabled

          ch = os.environ.get("CHANNEL", "animals")
          load_env(ch)
          settings = load_settings(ch)
          if instagram_sourcing_enabled(settings):
              ensure_instagram_session_ok(settings)
          PY
          fi

      - name: Run pipeline
        run: |
          python -m youtube_automation.app \
            --mode pipeline \
            --channel "$CHANNEL" \
            --cleanup

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add config/used_*.json || true
          git commit -m "Update used content after pipeline run" || echo "Nothing to commit"
          git push
