name: Publish video

on:
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to run"
        required: true
        default: animals
        type: choice
        options:
          - animals
          - dashcam

jobs:
  run:
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.channel || 'animals' }}

    concurrency:
      group: youtube-${{ github.event.inputs.channel || 'animals' }}
      cancel-in-progress: false

    env:
      CHANNEL: ${{ github.event.inputs.channel || 'animals' }}
      YT_PRIVACY: private # TODO: remove once tested

      # Reddit
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

      # YouTube
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      # AI providers
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      TEXT_GENERATOR_API_KEY: ${{ secrets.TEXT_GENERATOR_API_KEY }}
      REDDIT_COOKIES: ${{ secrets.REDDIT_COOKIES }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Write Reddit cookies
        run: |
          printf "%s\n" "$REDDIT_COOKIES" > reddit_cookies.txt
        env:
          REDDIT_COOKIES_FILE: reddit_cookies.txt

      - name: Run pipeline
        run: |
          python -m youtube_automation.app \
            --mode pipeline \
            --channel "$CHANNEL"
