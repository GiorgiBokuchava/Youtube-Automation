name: Publish video

on:
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to run"
        required: true
        default: animals
        type: choice
        options:
          - animals
          - dashcam

jobs:
  run:
    runs-on: ubuntu-latest

    concurrency:
      group: youtube-${{ github.event.inputs.channel || 'animals' }}
      cancel-in-progress: false

    env:
      CHANNEL: ${{ github.event.inputs.channel || 'animals' }}
      YT_PRIVACY: private # TODO: remove once tested

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pipeline
        run: |
          python -m youtube_automation.app \
            --mode pipeline \
            --channel "$CHANNEL"
