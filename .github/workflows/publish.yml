name: Publish video

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 */2 * *" # every 2 days
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to run"
        required: true
        default: animals
        type: choice
        options:
          - animals
          - dashcam

jobs:
  run:
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.channel || 'animals' }}

    concurrency:
      group: youtube-${{ github.event.inputs.channel || 'animals' }}
      cancel-in-progress: false

    env:
      CHANNEL: ${{ github.event.inputs.channel || 'animals' }}
      # Repository variable YT_PRIVACY_STATUS overrides channel YAML when set
      # (public | private | unlisted). Defaults to private for scheduled runs.
      YT_PRIVACY: ${{ vars.YT_PRIVACY_STATUS || 'private' }}

      # Reddit API (PRAW)
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

      # YouTube
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      # AI providers
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      TEXT_GENERATOR_API_KEY: ${{ secrets.TEXT_GENERATOR_API_KEY }}

      # Cookies (base64 stored inside REDDIT_COOKIES secret)
      REDDIT_COOKIES: ${{ secrets.REDDIT_COOKIES }}
      REDDIT_COOKIES_FILE: reddit_cookies.txt

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Preflight — YouTube OAuth refresh token
        run: |
          python -c "from youtube_automation.youtube.auth import ensure_youtube_refresh_token; ensure_youtube_refresh_token()"

      - name: Write Reddit cookies (decode secret)
        run: |
          echo "$REDDIT_COOKIES" | base64 --decode > "$REDDIT_COOKIES_FILE"
          test -s "$REDDIT_COOKIES_FILE"

      - name: Preflight - test cookies with yt-dlp
        run: |
          yt-dlp --version
          yt-dlp --cookies "$REDDIT_COOKIES_FILE" --skip-download \
            "https://www.reddit.com/r/StartledCats/comments/17cn6g6/"

      - name: Run pipeline
        run: |
          python -m youtube_automation.app \
            --mode pipeline \
            --channel "$CHANNEL"

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add config/used_*.json || true
          git commit -m "Update used content after pipeline run" || echo "Nothing to commit"
          git push
