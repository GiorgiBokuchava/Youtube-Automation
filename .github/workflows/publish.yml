name: Publish video

permissions:
  contents: write
  packages: read

on:
  schedule:
    - cron: "0 6 */2 * *" # every 2 days → long-form pipeline only (see pipeline_kind below)
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to run"
        required: true
        default: animals
        type: choice
        options:
          - animals
          - dashcam
      pipeline_kind:
        description: "Scheduled runs always use long-form; this applies to manual Run workflow only"
        required: true
        default: long_form
        type: choice
        options:
          - long_form
          - shorts

env:
  REGISTRY: ghcr.io

jobs:
  run:
    runs-on: ubuntu-latest

    concurrency:
      group: youtube-${{ github.event.inputs.channel || 'animals' }}
      cancel-in-progress: false

    env:
      CHANNEL: ${{ github.event.inputs.channel || 'animals' }}
      # Only workflow_dispatch may select shorts; schedule/push/other triggers always pipeline.
      APP_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline_kind == 'shorts') && 'shorts' || 'pipeline' }}
      # Optional: repository variable YT_PRIVACY_STATUS (public | private | unlisted)
      # overrides youtube.privacy_status in YAML. If unset, leave empty so CI does
      # not override channel config (same as before YT_PRIVACY was added to this file).
      YT_PRIVACY: ${{ vars.YT_PRIVACY_STATUS }}
      # Optional repo variable REDDIT_PREFLIGHT_URL overrides this default probe URL.
      REDDIT_PREFLIGHT_URL: ${{ vars.REDDIT_PREFLIGHT_URL || 'https://www.reddit.com/r/StartledCats/comments/17cn6g6/' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the commit step can rebase onto latest main before push.
          fetch-depth: 0

      # Same file as local .env (ANIMALS_*, DASHCAM_*, shared REDDIT_COOKIES, etc.).
      # Set once: gh secret set DOTENV < .env
      - name: Materialize .env from repository secret
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -z "${DOTENV}" ]; then
            echo "::error::Repository secret DOTENV is empty or unset. Copy your local .env: gh secret set DOTENV < .env"
            exit 1
          fi
          printf '%s\n' "${DOTENV}" > .env
          chmod 600 .env

      # ghcr.io/${{ github.repository }}:latest — registry paths must be lowercase.
      - name: Configure container image
        run: |
          image="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):latest"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull runtime image from GHCR
        run: |
          if ! docker pull "${IMAGE}"; then
            echo "::error::Could not pull ${IMAGE}. Run the \"Build Docker image\" workflow first (Actions → Build Docker image → Run workflow on main) so :latest exists on GHCR."
            exit 1
          fi

      - name: Verify checkout includes duration gate
        run: |
          grep -q assert_final_output_meets_target src/youtube_automation/pipeline.py
          grep -q build_thumbnail_from_image src/youtube_automation/media/thumbnail.py
          echo "Checkout commit: $(git rev-parse HEAD)"

      # Bind-mount replaces /app; refresh editable install + PYTHONPATH so Python
      # always imports this commit's src/, not a stale copy from image build time.
      - name: Sync Python package from checkout
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            --entrypoint pip \
            "${IMAGE}" \
            install -e . --no-deps -q
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            -e PYTHONPATH=/app/src \
            --entrypoint python \
            "${IMAGE}" \
            -c "import youtube_automation.pipeline as p; print('pipeline:', p.__file__)"

      - name: Prepare writable workspace directories
        run: |
          mkdir -p downloads thumbnails out
          # pip/sync or other root-owned docker steps may have created these on the mount.
          sudo chown -R "$(id -u):$(id -g)" downloads thumbnails out 2>/dev/null || true

      # Credentials come from mounted .env via load_env(CHANNEL) — same as local runs.
      - name: Preflight — YouTube OAuth refresh token
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/app/src \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            --entrypoint python \
            -e CHANNEL \
            "${IMAGE}" \
            /app/.github/scripts/preflight_youtube.py

      - name: Debug Reddit cookies (safe)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/app/src \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            --entrypoint python \
            -e CHANNEL \
            "${IMAGE}" \
            /app/.github/scripts/debug_reddit_cookies.py

      - name: Preflight — yt-dlp
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            --entrypoint yt-dlp \
            "${IMAGE}" \
            --version
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/app/src \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            --entrypoint python \
            -e CHANNEL \
            -e REDDIT_PREFLIGHT_URL \
            "${IMAGE}" \
            /app/.github/scripts/preflight_reddit_cookies.py

      - name: Preflight — Instagram session file (if configured)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/app/src \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            --entrypoint python \
            -e CHANNEL \
            -e APP_MODE \
            "${IMAGE}" \
            /app/.github/scripts/preflight_instagram.py

      - name: Run pipeline
        run: |
          echo "APP_MODE=${APP_MODE} (event=${GITHUB_EVENT_NAME}, channel=${CHANNEL})"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/app/src \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            -e CHANNEL \
            -e APP_MODE \
            -e YT_PRIVACY \
            "${IMAGE}" \
            --mode "$APP_MODE" \
            --channel "$CHANNEL" \
            --cleanup

      - name: Commit updated state
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add config/used_*.json || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Update used content after pipeline run (${CHANNEL})"

          # Another workflow (or push to main) may have landed while this job ran.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Pushed used-content update (attempt ${attempt})"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/3), retrying after fetch/rebase..."
            sleep 5
          done
          echo "::error::Failed to push used-content update after 3 attempts"
          exit 1
