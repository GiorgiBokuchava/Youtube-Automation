name: Publish video

permissions:
  contents: write
  packages: read

on:
  schedule:
    - cron: "0 6 */2 * *" # every 2 days → long-form pipeline only (see pipeline_kind below)
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to run"
        required: true
        default: animals
        type: string
      pipeline_kind:
        description: "Scheduled runs always use long-form; this applies to manual Run workflow only"
        required: true
        default: long_form
        type: choice
        options:
          - long_form
          - shorts

env:
  REGISTRY: ghcr.io

jobs:
  run:
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.channel || 'animals' }}

    concurrency:
      group: youtube-${{ github.event.inputs.channel || 'animals' }}
      cancel-in-progress: false

    env:
      CHANNEL: ${{ github.event.inputs.channel || 'animals' }}
      # Only workflow_dispatch may select shorts; schedule/push/other triggers always pipeline.
      APP_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline_kind == 'shorts') && 'shorts' || 'pipeline' }}
      # Optional: repository variable YT_PRIVACY_STATUS (public | private | unlisted)
      # overrides youtube.privacy_status in YAML. If unset, leave empty so CI does
      # not override channel config (same as before YT_PRIVACY was added to this file).
      YT_PRIVACY: ${{ vars.YT_PRIVACY_STATUS }}

      # Reddit API (PRAW)
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

      # YouTube
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      # AI providers
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
      TEXT_GENERATOR_API_KEY: ${{ secrets.TEXT_GENERATOR_API_KEY }}

      # Cookies (base64 stored inside REDDIT_COOKIES secret)
      REDDIT_COOKIES: ${{ secrets.REDDIT_COOKIES }}
      REDDIT_COOKIES_FILE: reddit_cookies.txt

      # Instaloader pickle as single-line standard base64 (no data: URI). Runner has no Firefox profile —
      # encode your local ``session-<user>`` file (same bytes Instaloader saved). Omit if Instagram sourcing is off.
      INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ghcr.io/${{ github.repository }}:latest — registry paths must be lowercase.
      - name: Configure container image
        run: |
          image="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):latest"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull runtime image from GHCR
        run: |
          if ! docker pull "${IMAGE}"; then
            echo "::error::Could not pull ${IMAGE}. Run the \"Build Docker image\" workflow first (Actions → Build Docker image → Run workflow on main) so :latest exists on GHCR."
            exit 1
          fi

      # Same env surface as the app; HOME writable for caches when using --user.
      - name: Preflight — YouTube OAuth refresh token
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            --entrypoint python \
            -e CHANNEL \
            -e YT_CLIENT_ID \
            -e YT_CLIENT_SECRET \
            -e YT_REFRESH_TOKEN \
            "${IMAGE}" \
            -c "from youtube_automation.youtube.auth import ensure_youtube_refresh_token; ensure_youtube_refresh_token()"

      - name: Write Reddit cookies (decode secret)
        run: |
          echo "$REDDIT_COOKIES" | base64 --decode > "$REDDIT_COOKIES_FILE"
          test -s "$REDDIT_COOKIES_FILE"

      - name: Preflight — yt-dlp and cookies
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            --entrypoint yt-dlp \
            "${IMAGE}" \
            --version
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            --entrypoint yt-dlp \
            "${IMAGE}" \
            --cookies "/app/${REDDIT_COOKIES_FILE}" --skip-download \
            "https://www.reddit.com/r/StartledCats/comments/17cn6g6/"

      - name: Preflight — Instagram session file (if configured)
        run: |
          if [ -n "${INSTAGRAM_SESSION_B64:-}" ]; then
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -v "${GITHUB_WORKSPACE}:/app" \
              -w /app \
              --entrypoint python \
              -e CHANNEL \
              -e APP_MODE \
              -e INSTAGRAM_SESSION_B64 \
              "${IMAGE}" \
              /app/.github/scripts/preflight_instagram.py
          fi

      - name: Run pipeline
        run: |
          echo "APP_MODE=${APP_MODE} (event=${GITHUB_EVENT_NAME}, channel=${CHANNEL})"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/app" \
            -w /app \
            -e CHANNEL \
            -e APP_MODE \
            -e YT_PRIVACY \
            -e REDDIT_CLIENT_ID \
            -e REDDIT_CLIENT_SECRET \
            -e REDDIT_USER_AGENT \
            -e YT_CLIENT_ID \
            -e YT_CLIENT_SECRET \
            -e YT_REFRESH_TOKEN \
            -e GEMINI_API_KEYS \
            -e OPENROUTER_API_KEYS \
            -e NVIDIA_API_KEYS \
            -e TEXT_GENERATOR_API_KEY \
            -e REDDIT_COOKIES_FILE \
            -e INSTAGRAM_SESSION_B64 \
            "${IMAGE}" \
            --mode "$APP_MODE" \
            --channel "$CHANNEL" \
            --cleanup

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add config/used_*.json || true
          git commit -m "Update used content after pipeline run" || echo "Nothing to commit"
          git push
