[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-automation"
version = "0.1.0"
description = "Automated YouTube video generation from Reddit"
requires-python = ">=3.10,<4.0"
dependencies = [
    "edge-tts>=7.2.7",
    "google-api-python-client>=2.161.0",
    "google-auth>=2.45.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "google-genai>=1.56.0",
    "httpx>=0.28.1",
    "openai>=2.14.0",
    "pillow>=12.0.0",
    "praw>=7.8.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "PyYAML>=6.0.3",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
    "yt-dlp>=2025.12.8",
    "ultralytics>=8.4.37,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
